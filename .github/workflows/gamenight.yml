# Game-night watcher: follows tonight's games and starts quick runs of the nightly update before puck drop (lineups,
# starters, injury news) and after each final (its post-game page within minutes), then one full update once the
# night is done. See pipeline/watch_games.py. GitHub stops a job after 6 hours, so each shift starts the next one
# itself before it ends (GitHub's timers ran hours late or not at all); between nights it waits for the next slate.
# The scheduled starts below only revive the chain if it ever breaks: one that lands while a shift is running waits
# in this queue, where a newer start replaces it.
name: Game-night watcher

on:
  schedule:
    - cron: "30 15 * * *"  # backups, in case the chain breaks
    - cron: "0 21 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  actions: write  # to start the nightly workflow
  contents: read

concurrency:
  group: gamenight
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: pipeline/watch_games.py
          sparse-checkout-cone-mode: false

      - name: Follow tonight's games
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 pipeline/watch_games.py
