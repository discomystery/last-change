# Nightly update: fetch new games, rebuild every table and number, rebuild the site, publish it.
# Also runs whenever a change to the pipeline, site or these workflows is merged into main, so merged changes go
# live without anyone pressing Run workflow. A full update rather than the offline publish, on purpose: runs share
# one queue and a newer queued run replaces an older one, so a merge must never knock out a scheduled data update.
# On game nights the watcher (gamenight.yml) starts this workflow in "quick" mode: tonight's lineups before puck drop
# and each post-game page minutes after the horn, in about a minute of work. A quick request becomes a full update
# whenever one is owed (new code since the last full update, or a scheduled slot below has passed), so a quick run
# that replaced a waiting full one in the queue does the full one's job (`python -m pipeline.run mode`).
# Data lives on the `data` branch between runs (restored at the start, saved at the end). Preview calls already
# frozen at puck drop come back with it, so they are never rewritten.
name: Nightly update

on:
  schedule:  # keep in step with FULL_SLOTS in pipeline/run.py
    - cron: "0 10 * * *"  # 10:00 UTC: after the last West Coast games are final
    - cron: "0 16 * * *"  # 16:00 UTC: refresh before the day's games, so previews freeze on fresh numbers
    - cron: "30 20 * * *"  # 20:30 UTC: pick up NHL.com's projected starting goalies (its previews go up 16:00-19:00 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "full: everything. quick: only tonight's previews and new post-game pages (becomes full when one is owed)."
        type: choice
        options: [full, quick]
        default: full
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "site/**"
      - "content/**"
      - ".github/workflows/nightly.yml"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: write
  issues: write  # the recording-change alarm opens an issue

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Restore data from the data branch
        run: |
          git fetch --depth=1 origin data
          mkdir -p data
          git archive FETCH_HEAD | tar -x -C data

      - name: Decide between a quick and a full update
        id: mode
        run: echo "mode=$(uv run --project pipeline python -m pipeline.run mode --requested '${{ inputs.mode || 'full' }}')" >> "$GITHUB_OUTPUT"

      - name: Restore the published numbers
        run: |
          # Start from what the last run published, never from the copy committed on main (it goes stale): a full
          # update rewrites every file but the previews frozen at puck drop, and reads a few (teams.json) before it does.
          mkdir -p site/public/data
          if [ -d data/site_data ]; then
            rm -rf site/public/data/previews
            cp -R data/site_data/. site/public/data/
          fi
          rm -rf data/site_data

      - name: Fetch new games and rebuild everything
        if: steps.mode.outputs.mode == 'full'
        run: uv run --project pipeline python -m pipeline.run update

      - name: Quick game-night pass (tonight's previews, new post-game pages)
        if: steps.mode.outputs.mode == 'quick'
        run: uv run --project pipeline python -m pipeline.run quick

      - name: Raise the alarm if the league changed how it records plays
        if: steps.mode.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # pipeline/metrics/drift.py compares this season's play-by-play with the seasons the chance model learned from.
          text="$(uv run --project pipeline python -m pipeline.metrics.drift --alarm)"
          if [ -n "$text" ]; then
            echo "::warning title=Recording change::The NHL's play-by-play no longer looks like the training seasons"
            title="Recording-change alarm: the NHL's play-by-play looks different"
            if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
              gh issue create --title "$title" --body "$text"
            fi
          fi

      - name: Run the pipeline tests
        id: tests
        if: steps.mode.outputs.mode == 'full'
        run: uv run --project pipeline pytest -q pipeline/tests

      - name: Open an issue when the tests fail
        # Nothing is saved or published after a failed test run, and every later run fails the same way until main
        # is fixed (game nights included), so say so where someone will see it.
        if: failure() && steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Site updates stopped: the pipeline tests are failing"
          if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" --body "The nightly workflow's tests failed on $(git rev-parse --short HEAD), so nothing was saved or published: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Every update fails the same way until main is fixed."
          fi

      - name: Build the site
        run: |
          npm ci --prefix site
          npm --prefix site run build

      - name: Save data to the data branch
        run: |
          pipeline/save_data.sh "Data cache, ${{ steps.mode.outputs.mode }} run $(date -u +%Y-%m-%dT%H:%MZ)"

      - name: Hand the built site to the deploy job
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: update
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      message: "Nightly deploy ${{ github.run_id }}"
