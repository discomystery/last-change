[project]
name = "last-change-pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "polars>=1.9",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pydantic>=2.8",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
